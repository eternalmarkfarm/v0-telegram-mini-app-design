groups:
  - name: infra-alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target down: {{ $labels.instance }}"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}."

      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 85% for 10 minutes."

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% for 10 minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} has less than 15% free space."

  - name: app-alerts
    rules:
      - alert: FastApiHigh5xxRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FastAPI elevated 5xx rate"
          description: "5xx rate is above 0.2 req/s over the last 5 minutes."

      - alert: FastApiHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "FastAPI high p95 latency"
          description: "p95 latency is above 1.5s for 10 minutes."

      - alert: BackendDown
        expr: up{job="fastapi_backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI backend down"
          description: "Target {{ $labels.instance }} is down for job fastapi_backend."

      - alert: PostgresExporterDown
        expr: up{job="postgres_exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Postgres exporter down"
          description: "Target {{ $labels.instance }} is down for job postgres_exporter."

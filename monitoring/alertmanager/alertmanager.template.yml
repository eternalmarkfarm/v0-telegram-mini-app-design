route:
  receiver: telegram
  group_by: ["alertname", "job"]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "__ALERTMANAGER_TG_BOT_TOKEN__"
        chat_id: "__ALERTMANAGER_TG_CHAT_ID__"
        send_resolved: true
        parse_mode: HTML
        message: |
          <b>{{ .Status | toUpper }}</b>: {{ .CommonLabels.alertname }}
          {{- if .CommonAnnotations.summary }}
          {{ .CommonAnnotations.summary }}
          {{- end }}
          {{- if .CommonAnnotations.description }}
          {{ .CommonAnnotations.description }}
          {{- end }}

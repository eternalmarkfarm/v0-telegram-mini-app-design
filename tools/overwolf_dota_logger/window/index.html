<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamDrop Dota Logger</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="window.js" defer></script>
  </head>
  <body>
    <header>
      <div class="title">StreamDrop Dota Logger</div>
      <div class="controls">
        <button id="clear">Clear</button>
        <label class="toggle">
          <input type="checkbox" id="autoScroll" checked />
          Auto-scroll
        </label>
      </div>
    </header>
    <main>
      <pre id="log"></pre>
    </main>
  </body>
</html>
